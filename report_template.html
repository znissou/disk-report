<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__REPORT_TITLE__</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee; --hover: #f0efec;
  --border: rgba(11, 11, 11, 0.10); --border-strong: rgba(11, 11, 11, 0.16);
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --track: #e1e0d9;
  --c-user: #2a78d6; --c-apps: #eb6834; --c-cache: #1baf7a; --c-dev: #eda100; --c-system: #e87ba4; --c-other: #898781;
  --on-user: #fff; --on-apps: #fff; --on-cache: #fff; --on-dev: #0b0b0b; --on-system: #fff; --on-other: #fff;
  --good: #0ca30c; --warning: #fab219; --good-ink: #006300; --good-bg: rgba(12, 163, 12, 0.10);
  --danger: #c4321f; --danger-line: rgba(196, 50, 31, 0.45); --danger-bg: rgba(196, 50, 31, 0.07);
  --code: #efeee9; --focus: #2a78d6; --link: #256abf;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --hover: #242422;
    --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.16);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --track: #2c2c2a;
    --c-user: #3987e5; --c-apps: #d95926; --c-cache: #199e70; --c-dev: #c98500; --c-system: #d55181; --c-other: #6f6e69;
    --on-dev: #fff;
    --good-ink: #0ca30c; --good-bg: rgba(12, 163, 12, 0.16);
    --danger: #ff7b6b; --danger-line: rgba(255, 123, 107, 0.5); --danger-bg: rgba(255, 123, 107, 0.10);
    --code: #262624; --focus: #6da7ec; --link: #6da7ec;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --hover: #242422;
  --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.16);
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --track: #2c2c2a;
  --c-user: #3987e5; --c-apps: #d95926; --c-cache: #199e70; --c-dev: #c98500; --c-system: #d55181; --c-other: #6f6e69;
  --on-dev: #fff;
  --good-ink: #0ca30c; --good-bg: rgba(12, 163, 12, 0.16);
  --danger: #ff7b6b; --danger-line: rgba(255, 123, 107, 0.5); --danger-bg: rgba(255, 123, 107, 0.10);
  --code: #262624; --focus: #6da7ec; --link: #6da7ec;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.page { max-width: 1120px; margin: 0 auto; padding: 28px 24px 48px; }
@media (max-width: 640px) { .page { padding: 20px 16px 40px; } }

/* masthead */
.mast-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
h1 { font-size: 22px; line-height: 1.25; margin: 2px 0 2px; font-weight: 650; }
.meta { color: var(--ink-2); font-size: 13px; }
.ghost { background: transparent; border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 10px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.ghost:hover { background: var(--hover); }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.hero { margin: 22px 0 14px; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.hero-num { font-size: 52px; line-height: 1; font-weight: 650; letter-spacing: -.02em; }
.hero-sub { color: var(--ink-2); font-size: 16px; }
.hero-sub b { color: var(--ink); font-weight: 600; }
.freed { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--good-ink); background: var(--good-bg);
  border-radius: 999px; padding: 3px 10px 3px 7px; font-weight: 600; align-self: center; }

/* the drive bar: one whole split into parts */
.segbar { display: flex; gap: 2px; height: 28px; margin-top: 6px; }
.seg { position: relative; height: 28px; border-radius: 4px; min-width: 3px; display: flex; align-items: center;
  padding: 0 8px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: default; }
.seg .lbl { pointer-events: none; }
.seg.free { background: var(--track); color: var(--ink-2); font-weight: 500; }
.legend { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 18px;
  color: var(--ink-2); font-size: 13px; }
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.tip { position: fixed; z-index: 20; background: var(--surface); color: var(--ink); border: 1px solid var(--border-strong);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 6px 24px rgba(0, 0, 0, .12);
  pointer-events: none; max-width: 280px; }
.tip b { display: block; }
.tip span { color: var(--ink-2); }

/* tabs and search */
.bar-row { position: sticky; top: 0; z-index: 10; background: var(--page); margin: 28px -4px 0; padding: 10px 4px 10px;
  border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto; min-width: 0; }
.tab { border: 0; background: transparent; padding: 6px 7px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { background: var(--hover); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--border-strong);
  font-weight: 600; }
.tab small { color: var(--muted); font-weight: 500; font-size: 12px; }
.search { flex: 1 1 100%; position: relative; }
@media (max-width: 860px) { .bar-row { position: static; } }
.search input { width: 100%; padding: 8px 12px 8px 32px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--ink); font: inherit; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* cards and sections */
main { margin-top: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
  margin-bottom: 18px; overflow: hidden; }
.card-head { padding: 16px 18px 12px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-end;
  flex-wrap: wrap; }
.card-head h2 { font-size: 16px; margin: 0; font-weight: 650; }
.card-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; max-width: 640px; }
.card-head .total { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.card-head .total b { font-size: 18px; color: var(--ink); font-weight: 650; margin-right: 4px; }
.section-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; flex-wrap: wrap; }
.section-head h2 { margin: 0; font-size: 20px; font-weight: 650; }
.section-head .sw { width: 12px; height: 12px; }
.section-head .total { color: var(--ink-2); }
.section-head .total b { color: var(--ink); font-size: 20px; margin-right: 4px; font-weight: 650; }
.section-desc { margin: -6px 0 16px; color: var(--ink-2); max-width: 720px; }
.note-line { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-2); font-size: 13px;
  margin: 0 0 14px; }
.note-line svg { flex: none; margin-top: 2px; color: var(--muted); }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  box-shadow: var(--shadow); }
.tile .label { display: flex; align-items: center; gap: 7px; color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 26px; font-weight: 650; margin-top: 4px; line-height: 1.15; }
.tile .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* category table (the bar's table view) */
.cats { width: 100%; }
.cat-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px 92px; gap: 14px; align-items: center; width: 100%;
  padding: 11px 18px; border: 0; border-top: 1px solid var(--border); background: transparent; text-align: left;
  cursor: pointer; }
.cat-row:hover { background: var(--hover); }
.cat-name { display: flex; gap: 10px; align-items: flex-start; }
.cat-name .sw { margin-top: 5px; }
.cat-name b { font-weight: 600; }
.cat-name span { display: block; color: var(--ink-2); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.num small { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 640px) { .cat-row { grid-template-columns: minmax(0, 1fr) 84px; } .cat-row .meter { display: none; } }

/* meters */
.meter { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; min-width: 2px; }

/* item rows */
.rows { border-top: 1px solid var(--border); }
.row { border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; }
.row-head { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 112px; gap: 12px; align-items: center;
  width: 100%; padding: 10px 18px 10px 14px; border: 0; background: transparent; text-align: left; cursor: pointer; }
.row-head:hover { background: var(--hover); }
.chev { color: var(--muted); transition: transform .15s; display: inline-flex; }
.row-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.row-name { font-weight: 600; overflow-wrap: anywhere; }
.row-name .tag { margin-left: 6px; }
.row-sub { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.row-size { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.row-size .meter { width: 100%; }
.row-size .num { font-weight: 600; }
@media (max-width: 640px) {
  .row-head { grid-template-columns: 18px minmax(0, 1fr) 84px; padding-right: 14px; }
  .row-head .badge-cell { grid-column: 2; grid-row: 2; justify-self: start; }
}
.nested { background: var(--surface-2); border-top: 1px solid var(--border); }
.nested .row-head { padding-left: 30px; }

/* badges and tags */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px;
  border: 1px solid var(--border-strong); font-size: 12px; color: var(--ink-2); white-space: nowrap; background: var(--surface); }
.badge svg { flex: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; vertical-align: 1px;
  white-space: nowrap; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warning); }
.tag.plain::before { background: var(--muted); }
.tag.ok { color: var(--good-ink); }
.tag.ok::before { background: var(--good); }
.tag.busy::before { background: var(--c-user); }

/* row details */
.detail { padding: 4px 18px 18px 44px; display: grid; gap: 14px; }
@media (max-width: 640px) { .detail { padding-left: 18px; } }
.detail p { margin: 0; }
.detail h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  font-weight: 650; }
.action { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.detail .notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.detail .notes li { display: flex; gap: 8px; align-items: flex-start; }
.detail .notes svg { flex: none; margin-top: 2px; }
code { font: 12.5px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--code);
  border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; padding: 0 6px;
  font-size: 11px; color: var(--ink-2); cursor: pointer; margin-left: 4px; vertical-align: 1px; }
.copy:hover { background: var(--hover); }
.copy.done { color: var(--good-ink); }
.copy.run { display: inline-flex; align-items: center; gap: 3px; color: var(--ink); }
.path { font: 12.5px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink-2); overflow-wrap: anywhere; }
.mini { display: grid; gap: 2px; }
.mini-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(60px, 160px) 76px; gap: 10px; align-items: center;
  padding: 3px 0; font-size: 13px; }
.mini-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-row .name small { color: var(--muted); margin-left: 6px; }
.mini-row .num { color: var(--ink); }
.linkish { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; text-align: left; font: inherit; }
.linkish:hover { text-decoration: underline; }
@media (max-width: 640px) { .mini-row { grid-template-columns: minmax(0, 1fr) 70px; } .mini-row .meter { display: none; } }
.files { display: grid; gap: 4px; }
.file-row { display: grid; grid-template-columns: minmax(0, 1fr) 92px 70px; gap: 10px; font-size: 13px; align-items: baseline; }
.file-row .path { overflow-wrap: anywhere; }
.file-row .date { color: var(--muted); font-size: 12px; white-space: nowrap; }
@media (max-width: 640px) { .file-row { grid-template-columns: minmax(0, 1fr) 70px; } .file-row .date { display: none; } }
.more { display: block; width: 100%; padding: 11px 18px; border: 0; border-top: 1px solid var(--border);
  background: transparent; color: var(--link); cursor: pointer; text-align: left; }
.more:hover { background: var(--hover); }
.small-line { padding: 10px 18px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
.empty { padding: 22px 18px; color: var(--ink-2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.badge-help { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px 18px;
  padding: 4px 18px 18px; }
.badge-help div { color: var(--ink-2); font-size: 13px; }
.badge-help .badge { margin-bottom: 4px; }
.dup { padding: 12px 18px; border-top: 1px solid var(--border); }
.dup-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.dup-head b { font-weight: 600; }
.dup-head span { color: var(--ink-2); font-size: 13px; }
.dup ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.dup li { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.foot { margin-top: 28px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.foot p { margin: 0 0 4px; }

/* app: buttons and actions */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--ink); border-radius: 8px; padding: 5px 11px; font-size: 13px; line-height: 1.4; cursor: pointer;
  white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .55; cursor: default; }
.btn svg { flex: none; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--page); }
.btn.primary:hover { background: var(--ink); opacity: .88; }
.btn.danger { color: var(--danger); border-color: var(--danger-line); }
.btn.danger:hover { background: var(--danger-bg); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger.solid:hover { background: var(--danger); opacity: .9; }
select.drive { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 8px; padding: 5px 8px; cursor: pointer; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.acts .meta { font-size: 12px; }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 24px; padding: 0;
  border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
.ib:hover { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }
.ib.del:hover { color: var(--danger); border-color: var(--danger-line); }
.racts { display: inline-flex; gap: 2px; justify-content: flex-end; }
.file-row.has-acts { grid-template-columns: minmax(0, 1fr) 92px 70px 56px; align-items: center; }
.mini-row.has-acts { grid-template-columns: minmax(0, 1fr) minmax(60px, 160px) 76px 56px; }
@media (max-width: 640px) {
  .file-row.has-acts, .mini-row.has-acts { grid-template-columns: minmax(0, 1fr) 70px 56px; }
}
.dup li .racts { margin-left: auto; }
.row.gone > .row-head .nm, .gone .pt { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.gone .copy { display: none; }
.group-acts { padding: 10px 18px 10px 44px; border-top: 1px solid var(--border); }

/* app: scan progress, empty drive, dialogs, messages */
.banner { margin-top: 18px; }
.banner .card { margin: 0; padding: 14px 18px; display: grid; gap: 10px; }
.banner-row { display: flex; align-items: center; gap: 12px; }
.banner-row .grow { flex: 1 1 auto; min-width: 0; }
.banner-row b { display: block; font-weight: 600; }
.banner-row .sub { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.progress { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--c-user); transition: width .4s ease; }
.spin { width: 18px; height: 18px; flex: none; border-radius: 50%; border: 2px solid var(--track); border-top-color: var(--c-user);
  animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } .progress i { transition: none; } }
.empty-state { padding: 52px 24px 56px; text-align: center; }
.empty-state h2 { margin: 0 0 6px; font-size: 20px; font-weight: 650; }
.empty-state p { margin: 0 auto 20px; max-width: 520px; color: var(--ink-2); }
.empty-state .btn { font-size: 14px; padding: 8px 16px; }
dialog.dlg { width: min(600px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--border-strong); border-radius: 14px;
  background: var(--surface); color: var(--ink); box-shadow: 0 24px 64px rgba(0, 0, 0, .28); }
dialog.dlg::backdrop { background: rgba(0, 0, 0, .38); }
.dlg-body { padding: 20px 22px 16px; display: grid; gap: 12px; }
.dlg-body h3 { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
.dlg-body p { margin: 0; color: var(--ink-2); }
.dlg-facts { display: grid; gap: 3px; max-height: 168px; overflow: auto; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--surface-2); }
.dlg-facts .path { font-size: 12px; }
.dlg-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); }
.dlg-line b { color: var(--ink); font-weight: 600; }
.dlg-warn { display: flex; gap: 8px; align-items: flex-start; margin: 0; color: var(--ink); font-size: 13px; }
.dlg-warn svg { flex: none; margin-top: 2px; }
.dlg-list { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 2px; overflow-wrap: anywhere; }
.dlg-list b { color: var(--ink); font-weight: 600; }
.dlg-hint { font-size: 12px; color: var(--muted); }
.dlg-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 22px;
  border-top: 1px solid var(--border); background: var(--surface-2); }
.dlg-busy { display: flex; align-items: center; gap: 10px; margin-right: auto; color: var(--ink-2); font-size: 13px; }
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: grid; gap: 8px; width: min(440px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 10px 8px 10px 12px; font-size: 13px; background: var(--surface);
  border: 1px solid var(--border-strong); border-left: 4px solid var(--muted); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .16); }
.toast.good { border-left-color: var(--good); }
.toast.bad { border-left-color: var(--danger); }
.toast.wait { border-left-color: var(--c-user); }
.toast .grow { flex: 1 1 auto; min-width: 0; }
.toast .acts { margin-top: 8px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="mast-row">
      <div>
        <div class="eyebrow">Disk report</div>
        <h1 id="title"></h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="tools" id="tools"><button id="theme" class="ghost" type="button"></button></div>
    </div>
    <div class="hero"><div class="hero-num" id="hero-num"></div><div class="hero-sub" id="hero-sub"></div><div id="hero-note"></div></div>
    <div class="segbar" id="segbar" role="img"></div>
    <ul class="legend" id="legend"></ul>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="bar-row" id="bar-row">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search folders, apps, paths…" aria-label="Search">
    </label>
  </div>
  <main id="main"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>
<dialog id="dlg" class="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toasts" aria-live="polite"></div>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
"use strict";
// A saved report carries its data in the page. Inside the Disk Report app the data is null here: the page asks
// the app for the latest scan instead, and gets buttons to act on what it shows.
const EMBEDDED = JSON.parse(document.getElementById("report-data").textContent);
let DATA = null, M = null, ITEMS = [], BY_ID = new Map();
let segTotals = {}, actionable = [], safeItems = [], optionalItems = [], dupWasted = 0;
const GB = 1024 ** 3, MB = 1024 ** 2;

const SEGS = [
  { id: "user", name: "Your files", cats: ["user"],
    desc: "Documents, Desktop, Downloads, Pictures… Only you can decide what can go." },
  { id: "apps", name: "Apps & their data", cats: ["app", "appdata"],
    desc: "Installed programs plus the settings and data they keep. Remove them by uninstalling." },
  { id: "cache", name: "Caches & temporary files", cats: ["cache"],
    desc: "Copies apps can rebuild or download again. Most of it is safe to clean." },
  { id: "dev", name: "Developer tools", cats: ["dev"],
    desc: "SDKs, emulators, Docker, virtual machines and project folders that can be rebuilt." },
  { id: "system", name: "Windows & system", cats: ["system"],
    desc: "Windows itself, its component store, the page file and the hibernation file." },
  { id: "other", name: "Other & hidden", cats: ["other"],
    desc: "Folders the report doesn't recognise, and space Windows doesn't let the scan see." },
];
const SEG_OF = { user: "user", app: "apps", appdata: "apps", cache: "cache", dev: "dev", system: "system", other: "other" };
const CAT_LABEL = { user: "Your files", app: "Program", appdata: "App data", cache: "Cache", dev: "Developer",
  system: "Windows", other: "Other" };
const SAFETY = {
  safe: { label: "Safe to clean", icon: "check", help: "Deleting it loses nothing: it's rebuilt or downloaded again." },
  optional: { label: "Optional", icon: "warn", help: "It can go, with a trade-off explained under “What you can do”." },
  review: { label: "Your files", icon: "user", help: "Only you can tell what's still needed." },
  uninstall: { label: "Uninstall to remove", icon: "box", help: "Uninstall the app instead of deleting its folders by hand." },
  keep: { label: "Keep", icon: "lock", help: "Needed by Windows or by an app you use." },
  unknown: { label: "Unknown", icon: "q", help: "Not recognised. Check what it is before deleting anything." },
};
const FLAG_LABEL = { leftover: "Probably left over", unlinked: "No app points here", nomatch: "No matching app",
  unused: "Not used" };

const ICONS = {
  check: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="var(--good)"/><path d="m4.8 8.2 2.1 2.1 4.3-4.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6 15 14H1L8 1.6Z" fill="var(--warning)"/><path d="M8 6v3.6" stroke="#0b0b0b" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.8" r=".95" fill="#0b0b0b"/></svg>',
  user: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--muted)" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.8 14c.6-2.8 2.7-4.3 5.2-4.3s4.6 1.5 5.2 4.3"/></svg>',
  box: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 5 8 2l5.5 3v6L8 14l-5.5-3V5Z"/><path d="M2.5 5 8 8l5.5-3M8 8v6"/></svg>',
  lock: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--muted)" stroke-width="1.5" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>',
  q: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--muted)" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".5" fill="var(--muted)"/></svg>',
  info: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v4" stroke-linecap="round"/><circle cx="8" cy="4.9" r=".6" fill="currentColor"/></svg>',
  file: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linejoin="round" style="vertical-align:-1px" aria-label="file"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13"/></svg>',
  chev: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg>',
  moon: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1Z"/></svg>',
  sun: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>',
  folder: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M1.8 4.3c0-.7.5-1.3 1.2-1.3h3.1l1.5 1.6h5.4c.7 0 1.2.5 1.2 1.2v6.3c0 .7-.5 1.2-1.2 1.2H3c-.7 0-1.2-.5-1.2-1.2z"/></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.2h11M6.2 4.2V2.8h3.6v1.4M4 4.2l.7 9.1c0 .5.4.9.9.9h4.8c.5 0 .9-.4.9-.9l.7-9.1M6.6 7v4.4M9.4 7v4.4"/></svg>',
  scan: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.4 8.6A5.5 5.5 0 1 1 11.8 4"/><path d="M13.6 1.9v2.6H11"/></svg>',
  run: '<svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11L13.5 8z" fill="currentColor"/></svg>',
  unbox: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 5 8 2l5.5 3v6L8 14l-5.5-3V5Z"/><path d="M2.5 5 8 8l5.5-3M8 8v6"/></svg>',
  out: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5"/><path d="M12 9.6v3.1c0 .5-.4.8-.8.8H3.3c-.5 0-.8-.3-.8-.8V4.8c0-.5.3-.8.8-.8h3.1"/></svg>',
};

// ------------------------------------------------------------------ helpers
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function size(n) {
  if (!(n > 0)) return "0 KB";
  if (n >= 100 * GB) return Math.round(n / GB) + " GB";
  if (n >= GB) return (n / GB).toFixed(1) + " GB";
  if (n >= MB) return Math.round(n / MB) + " MB";
  return Math.max(1, Math.round(n / 1024)) + " KB";
}
const pct = (n, of) => of ? (n / of * 100 < 0.1 && n > 0 ? "<0.1" : (n / of * 100).toFixed(n / of * 100 >= 10 ? 0 : 1)) + "%" : "";
const fmtInt = n => n.toLocaleString("en-US");
const plural = (n, one, many) => `${fmtInt(n)} ${n === 1 ? one : many}`;
function date(t) {
  if (!t) return "";
  return new Date(t * 1000).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
function rel(path, base) {
  if (base && path.toLowerCase().startsWith(base.toLowerCase() + "\\")) return path.slice(base.length + 1);
  return path;
}
const baseName = p => p.replace(/\\+$/, "").split("\\").pop();
function rich(text) {
  // escape, then turn `code` into code chips with a copy button (and, in the app, a Run button for the catalog's
  // cleaning commands)
  return esc(text).replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code><button class="copy" type="button" data-copy="${c}">Copy</button>` +
    (APP && Object.prototype.hasOwnProperty.call(APP.commands, c)
      ? `<button class="copy run" type="button" data-act="run" data-cmd="${c}">${ICONS.run}Run</button>` : ""));
}
function badge(safety) {
  const s = SAFETY[safety] || SAFETY.unknown;
  return `<span class="badge" title="${esc(s.help)}">${ICONS[s.icon]}${esc(s.label)}</span>`;
}
const segColor = seg => `var(--c-${seg})`;
const itemColor = it => segColor(SEG_OF[it.cat] || "other");
function meter(value, max, color) {
  const w = max > 0 ? Math.max(0.6, Math.min(100, value / max * 100)) : 0;
  return `<div class="meter"><i style="width:${w}%;background:${color}"></i></div>`;
}
function copyText(text, btn) {
  const done = () => { if (btn) { const old = btn.textContent; btn.textContent = "Copied"; btn.classList.add("done");
    setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1300); } };
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* nothing else to try */ }
    ta.remove();
  };
  if (APP) { api().copy(text).then(ok => ok ? done() : fallback(), fallback); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

// ------------------------------------------------------------------ data and totals
function load(data) {
  DATA = data; M = data.meta; ITEMS = data.items;
  BY_ID = new Map(ITEMS.map(i => [i.id, i]));
  segTotals = {};
  for (const s of SEGS) segTotals[s.id] = 0;
  for (const it of ITEMS) segTotals[SEG_OF[it.cat] || "other"] += it.size;
  for (const [cat, v] of Object.entries(DATA.small || {})) segTotals[SEG_OF[cat] || "other"] += v.size;
  actionable = ITEMS.filter(i => !i.container && i.kind !== "hidden");
  safeItems = actionable.filter(i => i.safety === "safe").sort((a, b) => b.size - a.size);
  optionalItems = actionable.filter(i => i.safety === "optional").sort((a, b) => b.size - a.size);
  dupWasted = (DATA.dupes || []).reduce((a, g) => a + g.size * (g.copies.length - 1), 0)
    + (DATA.dupFolders || []).reduce((a, g) => a + g.size * (g.paths.length - 1), 0);
}
const sumOf = list => list.reduce((a, i) => a + i.size, 0);

// ------------------------------------------------------------------ state
const state = { tab: "overview", query: "", open: new Set(), more: new Set(), safety: null };

// ------------------------------------------------------------------ header
function renderHeader() {
  document.getElementById("title").textContent = M.drive + " drive";
  const mins = M.seconds >= 90 ? Math.round(M.seconds / 60) + " min" : M.seconds + " s";
  const [day, time] = M.generated.split(" ");
  const when = new Date(day + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  document.getElementById("meta").textContent =
    `Scanned ${when} at ${time} · ${fmtInt(M.files)} files in ${fmtInt(M.folders)} folders · took ${mins}` +
    (M.admin ? " · as administrator" : "");
  document.getElementById("hero-num").textContent = size(M.used);
  document.getElementById("hero-sub").innerHTML = `used of ${esc(size(M.total))} · <b>${esc(size(M.free))} free</b>`;

  const bar = document.getElementById("segbar");
  const parts = SEGS.map(s => ({ id: s.id, name: s.name, value: segTotals[s.id], color: segColor(s.id), on: `var(--on-${s.id})` }));
  bar.setAttribute("aria-label", "Drive " + M.drive + ": " + parts.map(p => `${p.name} ${size(p.value)}`).join(", ") +
    `, free ${size(M.free)}, total ${size(M.total)}`);
  bar.innerHTML = parts.map(p =>
    `<div class="seg" tabindex="0" data-name="${esc(p.name)}" data-value="${p.value}" data-seg="${p.id}"
      style="flex:${p.value} 1 0;background:${p.color};color:${p.on}"><span class="lbl">${pct(p.value, M.total)}</span></div>`
  ).join("") + `<div class="seg free" tabindex="0" data-name="Free space" data-value="${M.free}"
      style="flex:${M.free} 1 0"><span class="lbl">${esc(size(M.free))} free</span></div>`;
  document.getElementById("legend").innerHTML = parts.map(p =>
    `<li><span class="sw" style="background:${p.color}"></span>${esc(p.name)}</li>`).join("") +
    `<li><span class="sw" style="background:var(--track)"></span>Free space</li>`;
  fitLabels();
  bindTips(bar, M.total, M.used);
}
function bindTips(bar, total, used) {
  const tip = document.getElementById("tip");
  const show = (el, x, y) => {
    const v = +el.dataset.value;
    tip.innerHTML = `<b>${esc(el.dataset.name)} · ${esc(size(v))}</b><span>${pct(v, total)} of the drive` +
      (el.dataset.seg ? ` · ${pct(v, used)} of the used space` : "") + "</span>";
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + "px";
    tip.style.top = Math.max(8, y - r.height - 12) + "px";
  };
  bar.querySelectorAll(".seg").forEach(el => {
    el.addEventListener("mousemove", e => show(el, e.clientX, el.getBoundingClientRect().top));
    el.addEventListener("focus", () => { const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); });
    el.addEventListener("mouseleave", () => { tip.hidden = true; });
    el.addEventListener("blur", () => { tip.hidden = true; });
    if (el.dataset.seg) el.addEventListener("click", () => setTab(el.dataset.seg));
    if (el.dataset.seg) el.style.cursor = "pointer";
  });
}
function fitLabels() {
  // a label prints inside its block only when it fits; otherwise it takes no space at all
  document.querySelectorAll("#segbar .seg").forEach(el => {
    const lbl = el.querySelector(".lbl");
    lbl.style.display = "";
    if (lbl.scrollWidth + 14 > el.clientWidth) lbl.style.display = "none";
  });
}
window.addEventListener("resize", fitLabels);

// ------------------------------------------------------------------ tabs
const TAB_NAMES = { user: "Your files", apps: "Apps", cache: "Caches", dev: "Developer", system: "Windows", other: "Other" };
function tabs() {
  const list = [{ id: "overview", name: "Overview" }];
  for (const s of SEGS) list.push({ id: s.id, name: TAB_NAMES[s.id], size: segTotals[s.id], color: segColor(s.id) });
  if ((DATA.dupes || []).length || (DATA.dupFolders || []).length) list.push({ id: "dupes", name: "Duplicates", size: dupWasted });
  return list;
}
function renderTabs() {
  document.getElementById("tabs").innerHTML = tabs().map(t =>
    `<button class="tab" role="tab" type="button" data-tab="${t.id}" aria-selected="${state.tab === t.id && !state.query}">` +
    (t.color ? `<span class="sw" style="background:${t.color}"></span>` : "") +
    `${esc(t.name)}${t.size != null ? ` <small>${esc(size(t.size))}</small>` : ""}</button>`).join("");
}
function setTab(id, keepScroll) {
  state.tab = id; state.query = ""; state.safety = null;
  document.getElementById("search").value = "";
  render();
  if (!keepScroll) {
    const top = document.querySelector(".bar-row").getBoundingClientRect().top + window.scrollY;
    if (window.scrollY > top) window.scrollTo({ top: top });
  }
}

// ------------------------------------------------------------------ rows
function subLine(it) {
  if (it.kind === "hidden") return "Not in any folder";
  if (it.kind === "artifacts" || it.kind === "merged") {
    const n = it.partCount || (it.parts || []).length;
    if (n > 1) return `${n} folders` + (it.group ? ` · ${it.group}` : "");
  }
  return (it.paths && it.paths[0]) || "";
}
function flagTags(it) {
  return (it.flags || []).filter(f => FLAG_LABEL[f]).map(f =>
    `<span class="tag${f === "unused" ? " plain" : ""}">${esc(FLAG_LABEL[f])}</span>`).join("");
}
function itemRow(it, max, opts = {}) {
  const open = state.open.has(it.id);
  const done = itemState(it);
  return `<div class="row${done && done.state !== "partial" ? " gone" : ""}" data-id="${it.id}">
    <button class="row-head" type="button" aria-expanded="${open}" data-toggle="${it.id}">
      <span class="chev">${ICONS.chev}</span>
      <span><span class="row-name"><span class="nm">${esc(it.name)}</span>${flagTags(it)}${opts.showCat ? ` <span class="tag plain">${esc(CAT_LABEL[it.cat])}</span>` : ""}${stateTag(it, done)}</span>
        <span class="row-sub">${esc(subLine(it))}</span></span>
      <span class="badge-cell">${badge(it.safety)}</span>
      <span class="row-size"><span class="num">${esc(size(it.size))}</span>${meter(it.size, max, itemColor(it))}</span>
    </button>
    ${open ? `<div class="detail">${details(it)}</div>` : ""}
  </div>`;
}
function details(it) {
  const out = [];
  const base = it.paths && it.paths[0];
  const del = rowDeletable(it);
  out.push(`<p>${rich(it.desc || "")}</p>`);
  if (it.action) out.push(`<div class="action"><h4>What you can do</h4><p>${rich(it.action)}</p></div>`);
  if (APP) out.push(actionBar(it));
  if (it.notes && it.notes.length) out.push(`<ul class="notes">${it.notes.map(n =>
    `<li>${(it.flags || []).some(f => f !== "unused" && FLAG_LABEL[f]) ? ICONS.warn : ICONS.info}<span>${rich(n)}</span></li>`).join("")}</ul>`);
  const facts = [];
  if (it.group && it.group !== it.name) facts.push(`Belongs to <b>${esc(it.group)}</b>`);
  if (it.files) facts.push(`${fmtInt(it.files)} files`);
  if (facts.length) out.push(`<p class="meta">${facts.join(" · ")}</p>`);
  if (it.parts && it.parts.length) {
    out.push(`<div><h4>${it.kind === "artifacts" ? "Where they are" : "Folders"}${it.partCount > it.parts.length ? ` (largest ${it.parts.length} of ${it.partCount})` : ""}</h4>
      <div class="files">${it.parts.map(([p, s, t]) => {
        const done = pathState(p);
        return `<div class="file-row${APP ? " has-acts" : ""}${done ? " gone" : ""}"><span class="path"><span class="pt">${esc(p)}</span> <button class="copy" type="button" data-copy="${esc(p)}">Copy</button>${done ? doneTag(done) : ""}</span>
      <span class="date">${t ? "changed " + esc(date(t)) : ""}</span><span class="num">${esc(size(s))}</span>${rowActs(p, { id: it.id, del: del && !isProtected(p), contents: it.cat === "cache", size: s, done })}</div>`;
      }).join("")}</div></div>`);
  } else if (base) {
    out.push(`<div><h4>Location</h4>${(it.paths || []).map(p =>
      `<div class="path">${esc(p)} <button class="copy" type="button" data-copy="${esc(p)}">Copy path</button></div>`).join("")}</div>`);
  }
  if (it.kids && it.kids.length) {
    const max = it.kids[0][1];
    const rows = it.kids.map(([name, s, isFile, other]) => {
      const o = other != null ? BY_ID.get(other) : null;
      const full = base + "\\" + name;
      const done = o ? null : pathState(full);
      const where = o ? ` <small>→ <button class="linkish" type="button" data-reveal="${o.id}">${esc(o.name)}</button></small>` : "";
      return `<div class="mini-row${APP ? " has-acts" : ""}${done ? " gone" : ""}"><span class="name" title="${esc(name)}">${isFile ? ICONS.file + " " : ""}<span class="pt">${esc(name)}</span>${where}${done ? doneTag(done) : ""}</span>
        ${meter(s, max, o ? itemColor(o) : itemColor(it))}<span class="num">${esc(size(s))}</span>${rowActs(full, { id: it.id, del: del && !o, file: isFile, size: s, done })}</div>`;
    });
    if (it.rest) rows.push(`<div class="mini-row${APP ? " has-acts" : ""}"><span class="name"><i>Everything else</i></span>${meter(it.rest, max, "var(--muted)")}<span class="num">${esc(size(it.rest))}</span>${APP ? "<span></span>" : ""}</div>`);
    out.push(`<div><h4>What's inside</h4><div class="mini">${rows.join("")}</div></div>`);

  }

}
function rowList(list, key, opts = {}) {

  const rest = list.slice(shown.length);
  const max = list[0].size;
  return `<div class="rows">${shown.map(it => itemRow(it, max, opts)).join("")}</div>` +
    (rest.length ? `<button class="more" type="button" data-more="${esc(key)}">Show ${rest.length} more (${esc(size(sumOf(rest)))})</button>` : "");

function searchView(q) {

// ------------------------------------------------------------------ render and events
function render() {
  if (!DATA) return;
  renderTabs();
  const main = document.getElementById("main");
  if (state.query) main.innerHTML = searchView(state.query);
  else if (state.tab === "overview") main.innerHTML = overview();
  else if (state.tab === "apps") main.innerHTML = appsView();
  else if (state.tab === "dupes") main.innerHTML = dupesView();
  else main.innerHTML = categoryView(state.tab);
}
function reveal(id) {
  const it = BY_ID.get(id);
  if (!it) return;
  state.open.add(id);
  const seg = SEG_OF[it.cat] || "other";
  if (it.cat === "app" || it.cat === "appdata") state.open.add("g:" + (it.group || it.name));
  state.more.add(seg === "apps" ? "apps" : "cat-" + seg);
  setTab(seg, true);
  requestAnimationFrame(() => {
    const el = document.querySelector(`.row[data-id="${id}"]`);
    if (el) { el.scrollIntoView({ block: "center" }); el.querySelector(".row-head").focus({ preventScroll: true }); }
  });
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a) {
    e.stopPropagation();
    if (!a.disabled) act(a).catch(err => { BUSY = false; toast(`Something went wrong: ${esc(err && err.message || err)}`, "bad"); });
    return;
  }
  const t = e.target.closest("[data-copy],[data-toggle],[data-tab],[data-more],[data-reveal]");
  if (!t) return;
  if (t.dataset.copy != null) { e.stopPropagation(); copyText(t.dataset.copy, t); return; }
  if (t.dataset.reveal != null) { reveal(+t.dataset.reveal); return; }
  if (t.dataset.tab) { setTab(t.dataset.tab); return; }
  if (t.dataset.more) { state.more.add(t.dataset.more); render(); return; }
  if (t.dataset.toggle != null) {
    const raw = t.dataset.toggle, key = /^\d+$/.test(raw) ? +raw : raw;
    if (state.open.has(key)) state.open.delete(key); else state.open.add(key);
    const y = t.getBoundingClientRect().top;
    render();
    const again = document.querySelector(`[data-toggle="${CSS.escape(raw)}"]`);
    if (again) { window.scrollBy(0, again.getBoundingClientRect().top - y); again.focus({ preventScroll: true }); }
  }
});
let searchTimer = 0;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.query = e.target.value.trim(); render(); }, 150);
});

// ================================================================== the app
// Everything below runs only inside the Disk Report app, where window.pywebview.api reaches the Python side.
let APP = null;               // what the app told us: drives, the scan's id, the cleaning commands it may run…
let DONE = new Map();         // lower-case path -> {state} for what was deleted since this scan ("left": left alone)
let REMOVED = new Map();      // app group -> Set of its programs (indexes in DATA.apps[group]) uninstalled since
let WAITING = new Map();      // app group -> name of the program whose uninstaller is running
let PROTECTED = new Set();    // folders the app never deletes whole (Documents, AppData…)
let LOCKED = [];              // folders in which the app deletes nothing at all: other accounts' folders
let FREED = 0;                // bytes freed since this scan
let PENDING = null;           // what the open dialog is about
let BUSY = false;             // a dialog is working: Escape doesn't close it
let SCAN = null;              // the running scan's status
let LAST_DELETE = null;       // for "Delete the rest as administrator"
const DELETABLE = new Set(["safe", "optional", "unknown", "review"]);
const STATE_LABEL = { deleted: "Deleted", trashed: "In Recycle Bin", emptied: "Emptied", partial: "Partly deleted" };
const SETTINGS_LINKS = [
  [/Settings → System → Storage/, "storage", "Open Storage settings"],
  [/Settings → Time & language → Language & region/, "language", "Open Language settings"],
  [/System protection/, "protection", "Open System protection"],
  [/Settings → Personalization → Fonts/, "fonts", "Open Fonts settings"],
  [/Settings → Apps\b/, "apps", "Open Installed apps"],
];
const api = () => window.pywebview.api;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function whenApp(start) {
  if (window.pywebview && window.pywebview.api && window.pywebview.api.state) start();
  else window.addEventListener("pywebviewready", start, { once: true });
}
async function startApp() {
  APP = { commands: {}, drives: [], version: "" };   // so the first render already knows it's the app
  try {
    applyState(await api().state(null));
  } catch (err) {
    document.getElementById("main").innerHTML = `<div class="card"><div class="empty-state"><h2>Disk Report couldn't open its scans</h2>
      <p>${esc(err && err.message || err)}</p></div></div>`;
    return;
  }

}
function applyState(st) {
  APP = st;
  PROTECTED = new Set(st.protected || []);
  LOCKED = st.locked || [];
  if (st.theme) { document.documentElement.dataset.theme = st.theme; paintThemeButton(); }
  if (st.scan) load(st.scan);
  else { DATA = null; M = null; ITEMS = []; BY_ID = new Map(); }
  // what was done since this scan: after load(), as the records name the scan's paths and apps
  DONE = new Map(); REMOVED = new Map(); FREED = 0;
  for (const r of st.done || []) applyRecord(r);
  if (DATA) {
    document.getElementById("bar-row").hidden = false;
    renderHeader(); render();
  } else renderEmpty();
  renderFreed(); renderFoot(); renderTools();
}
function applyRecord(r) {
  if (r.kind === "delete") {
    for (const p of r.paths || []) if (p.state !== "failed") DONE.set(p.path.toLowerCase(), { state: p.state });
    for (const p of r.inner || []) DONE.set(p.path.toLowerCase(), { state: p.state });   // listed things that went too
    for (const p of r.untouched || []) DONE.set(p.toLowerCase(), { state: "left" });     // and those left alone
    FREED += r.freed || 0;
  } else if (r.kind === "empty-bin" && r.ok) {
    FREED += r.freed || 0;
    const drive = r.drive || (M && M.drive);
    if (drive) DONE.set((drive + "\\$recycle.bin").toLowerCase(), { state: "emptied" });
  } else if (r.kind === "uninstall" && r.state === "removed") {
    markRemoved(r);
  }
}
// -- uninstalled programs: one app group can hold several (NVIDIA, Python…)
function programsOf(group) { return (DATA && DATA.apps && DATA.apps[group]) || []; }
function removedIn(group) { return REMOVED.get(group) || new Set(); }
function markRemoved(r) {
  const list = programsOf(r.group), set = new Set(removedIn(r.group));
  if (r.index != null && r.index < list.length) set.add(r.index);
  else list.forEach((u, i) => { if (u.name === r.name) set.add(i); });   // Disk Report 2.0 logged no index
  REMOVED.set(r.group, set);
}
// every program Disk Report could uninstall in this group is gone, so its folders are leftovers
function groupGone(group) {
  const list = programsOf(group), done = removedIn(group);
  return list.length > 0 && list.every((_, i) => done.has(i));
}
function stillInstalled(group) {
  const done = removedIn(group);
  return programsOf(group).filter((_, i) => !done.has(i)).map(u => u.name);
}

// -- what each item and row can do
const targetsOf = it => it.targets || it.paths || [];
const isLocked = p => { const key = p.toLowerCase(); return LOCKED.some(f => key === f || key.startsWith(f + "\\")); };
const isProtected = p => PROTECTED.has(p.toLowerCase().replace(/\\+$/, "")) || isLocked(p);

function pathState(p) {
  if (!APP || !DONE.size || !p) return null;
  const own = p.toLowerCase();
  let key = own;
  for (;;) {
    const s = DONE.get(key);
    if (s) {
      if (s.state === "left") return null;                // left alone on purpose: as it was
      if (key === own) return s;
      if (s.state === "partial") return null;            // inside a folder that's only partly gone: unknown
      return { state: s.state === "trashed" ? "trashed" : "deleted" };

}
function itemState(it) {

  const paths = targetsOf(it);
  if (!paths.length) return null;
  const states = paths.map(pathState);
  if (states.every(s => !s)) return null;
  if (states.some(s => !s || s.state === "partial")) return { state: "partial" };
  return states[0];
}
function stateTag(it, done) {

  if (!it.group || it.cat !== "app") return "";
  if (WAITING.get(it.group) === it.name) return ` <span class="tag busy">Uninstalling…</span>`;
  const program = programsOf(it.group).findIndex(u => u.name === it.name);
  if (groupGone(it.group) || (program >= 0 && removedIn(it.group).has(program))) return ` <span class="tag ok">Uninstalled</span>`;
  return "";
}
function groupTag(group) {
  if (!APP) return "";
  if (WAITING.has(group)) return ` <span class="tag busy">Uninstalling…</span>`;
  if (groupGone(group)) return ` <span class="tag ok">Uninstalled</span>`;
  const done = removedIn(group).size;
  if (done) return ` <span class="tag">${done} of ${programsOf(group).length} uninstalled</span>`;

}
const doneTag = s => ` <span class="tag ${s.state === "partial" ? "" : "ok"}">${esc(STATE_LABEL[s.state])}</span>`;
function rowDeletable(it) {

}

}

  if (!["uninstall", "optional"].includes(it.safety) || !["app", "appdata", "dev"].includes(it.cat)) return [];
  const done = removedIn(it.group);

}
function settingsFor(text, skipApps) {

}
function actBtn(act, label, cls, data) {
  const attrs = Object.entries(data || {}).map(([k, v]) => ` data-${k}="${esc(v)}"`).join("");

}
function actionBar(it) {
  const btns = [];
  const paths = targetsOf(it);

    const n = paths.length;
    btns.push(actBtn("delete", `${ICONS.trash}${n > 1 ? `Delete these ${n} folders…` : "Delete…"}`, "danger", { id: it.id }));
  }
  const uninstallers = uninstallersFor(it);
  for (const [i, u] of uninstallers) btns.push(actBtn("uninstall", `${ICONS.unbox}Uninstall ${esc(u.name)}…`, "danger", { group: it.group, index: i }));
  if (paths.length === 1 && it.kind !== "hidden" && !(done && done.state !== "partial")) btns.push(actBtn("explore", `${ICONS.folder}Open in Explorer`, "", { path: paths[0] }));
  for (const [, key, label] of settingsFor(`${it.action || ""} ${it.desc || ""}`, uninstallers.length > 0)) btns.push(actBtn("settings", `${ICONS.out}${label}`, "", { key }));
  if (WAITING.has(it.group)) btns.push(`<span class="meta">Waiting for the uninstaller…</span>`);

}
function groupActs(main) {
  if (!APP || !main.group) return "";

  if (groupGone(main.group)) return `<div class="group-acts acts"><span class="tag ok">Uninstalled</span><span class="meta">Its leftover folders below can now be deleted. Scan again to see what it freed.</span></div>`;
  const list = uninstallersFor(main);
  const removed = [...removedIn(main.group)].map(i => programsOf(main.group)[i].name);
  if (!list.length && !removed.length) return "";
  const note = (removed.length ? `Uninstalled: ${removed.map(esc).join(", ")}. ` : "") +
    (list.length ? "Uninstall starts the program's own uninstaller, as Settings → Apps does." : "");
  return `<div class="group-acts acts">${list.map(([i, u]) => actBtn("uninstall", `${ICONS.unbox}Uninstall ${esc(u.name)}…`, "danger", { group: main.group, index: i })).join("")}<span class="meta">${note}</span></div>`;

function rowActs(path, opts) {
  if (!APP) return "";
  if (opts.done && opts.done.state !== "partial") return "<span></span>";
  const name = baseName(path);
  const del = opts.del && !isProtected(path)
    ? `<button class="ib del" type="button" data-act="delete" data-path="${esc(path)}"${opts.id != null ? ` data-id="${opts.id}"` : ""}${opts.contents ? ' data-contents="1"' : ""}${opts.file ? ' data-file="1"' : ""}${opts.dup ? ' data-dup="1"' : ""} data-size="${opts.size || 0}" title="Delete…" aria-label="Delete ${esc(name)}">${ICONS.trash}</button>` : "";
  return `<span class="racts"><button class="ib" type="button" data-act="explore" data-path="${esc(path)}" title="Show in File Explorer" aria-label="Show ${esc(name)} in File Explorer">${ICONS.folder}</button>${del}</span>`;

// -- header pieces
function renderTools() {
  let box = document.getElementById("app-tools");
  if (!box) {
    box = document.createElement("div"); box.id = "app-tools"; box.className = "tools";
    document.getElementById("tools").prepend(box);
  }
  const scanning = SCAN && SCAN.running;
  const drives = APP.drives.length > 1
    ? `<select class="drive" id="drive" aria-label="Drive"${scanning ? " disabled" : ""}>${APP.drives.map(d =>
      `<option value="${esc(d.drive)}"${d.drive === APP.drive ? " selected" : ""}>${esc(d.drive)} · ${esc(size(d.total))}</option>`).join("")}</select>` : "";
  box.innerHTML = drives + `<button class="btn primary" type="button" data-act="scan"${scanning ? " disabled" : ""}>${ICONS.scan}${scanning ? "Scanning…" : DATA ? "Scan again" : "Scan " + esc(APP.drive)}</button>`;
}
function renderFreed() {
  const el = document.getElementById("hero-note");
  if (!APP || !DATA || FREED <= 0) { el.innerHTML = ""; return; }
  el.innerHTML = `<span class="freed">${ICONS.check}You freed ${esc(size(FREED))} since this scan${APP.usage ? ` · ${esc(size(APP.usage.free))} free now` : ""}</span>`;

function renderEmpty() {

  bar.innerHTML = `<div class="seg" tabindex="0" data-name="Used" data-value="${u.used}" style="flex:${u.used} 1 0;background:var(--c-other);color:var(--on-other)"><span class="lbl">${pct(u.used, u.total)}</span></div>` +
    `<div class="seg free" tabindex="0" data-name="Free space" data-value="${u.free}" style="flex:${u.free} 1 0"><span class="lbl">${esc(size(u.free))} free</span></div>`;

    <h2>See what's filling ${esc(APP.drive)}</h2>

    <button class="btn primary" type="button" data-act="scan"${scanning ? " disabled" : ""}>${ICONS.scan}${scanning ? "Scanning…" : "Scan " + esc(APP.drive) + " now"}</button></div></div>`;

// -- scanning
async function startScan() {
  const r = await api().scan(APP.drive);
  if (!r.ok) { toast(esc(r.error), "bad"); return; }
  SCAN = { running: true, drive: APP.drive, stage: "apps", text: "Starting...", files: 0, folders: 0, seconds: 0 };
  renderBanner(); renderTools();
  if (!DATA) renderEmpty();
  pollScan();
}
let scanTimer = 0;
async function pollScan() {
  clearTimeout(scanTimer);
  SCAN = await api().scan_status();
  renderBanner();
  if (SCAN.running) { scanTimer = setTimeout(pollScan, 400); return; }
  renderTools();
  if (SCAN.finished) {
    state.open.clear(); state.more.clear(); state.query = ""; document.getElementById("search").value = "";
    applyState(await api().state(SCAN.drive));
    toast(`Scan of ${esc(SCAN.drive)} finished. This is the new report.`, "good");
  } else if (SCAN.cancelled) {
    if (!DATA) renderEmpty();
    toast("Scan cancelled. Nothing was changed.");
  } else if (SCAN.error) {
    if (!DATA) renderEmpty();
    toast(esc(SCAN.error), "bad");
  }
  SCAN = null; renderBanner(); renderTools();
}
const STAGE_AT = { apps: 0.02, windows: 0.9, store: 0.93, explain: 0.96, dupes: 0.98 };
function renderBanner() {
  const el = document.getElementById("banner");
  const s = SCAN;
  if (!s || !s.running) { el.hidden = true; el.innerHTML = ""; return; }
  // walking the drive: compared with the last scan's files and folders when there is one, else with bytes
  const walked = s.expected ? ((s.files || 0) + (s.folders || 0)) / s.expected : s.used ? (s.counted || 0) / s.used : 0;
  const frac = s.stage in STAGE_AT ? STAGE_AT[s.stage] : 0.03 + 0.85 * Math.min(1, walked);
  const secs = s.seconds || 0;
  const clock = Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0");
  const what = s.stage === "scan" ? `${fmtInt(s.files || 0)} files in ${fmtInt(s.folders || 0)} folders` : (s.text || "");
  if (!el.firstElementChild) {
    el.innerHTML = `<div class="card"><div class="banner-row"><span class="spin" aria-hidden="true"></span>
      <div class="grow"><b id="scan-title"></b><span class="sub" id="scan-sub"></span></div>
      <button class="btn" type="button" data-act="cancel-scan">Cancel</button></div>
      <div class="progress" role="progressbar" aria-label="Scan progress" aria-valuemin="0" aria-valuemax="100"><i></i></div>
      <div class="meta" id="scan-note"></div></div>`;
  }
  el.hidden = false;
  el.querySelector("#scan-title").textContent = `Scanning ${s.drive}…`;
  el.querySelector("#scan-sub").textContent = `${what} · ${clock}`;
  el.querySelector("#scan-note").textContent = "The scan only reads your drive." + (DATA ? " You can keep using the last report meanwhile." : "");
  const bar = el.querySelector(".progress");
  bar.setAttribute("aria-valuenow", Math.round(frac * 100));
  bar.firstElementChild.style.width = (frac * 100).toFixed(1) + "%";
}

// -- dialogs and messages
const dlg = document.getElementById("dlg");
dlg.addEventListener("cancel", e => { if (BUSY) e.preventDefault(); });
function openDialog(html) {
  dlg.innerHTML = html;
  if (!dlg.open) dlg.showModal();
  const first = dlg.querySelector("[autofocus]");
  if (first) first.focus();
}
function closeDialog() { BUSY = false; PENDING = null; if (dlg.open) dlg.close(); }
function dialogBusy(text) {
  BUSY = true;
  const foot = dlg.querySelector(".dlg-foot");
  if (!foot) return;
  foot.querySelectorAll("button:not([data-act=stop-delete])").forEach(b => { b.disabled = true; });
  let note = foot.querySelector(".dlg-busy");
  if (!note) { note = document.createElement("div"); note.className = "dlg-busy"; foot.prepend(note); }
  note.innerHTML = `<span class="spin" aria-hidden="true"></span><span>${esc(text)}</span>`;
}
function dialogStop(task) {
  // a permanent delete can be stopped between files; what's already deleted stays deleted
  const note = dlg.querySelector(".dlg-foot .dlg-busy");
  if (note) note.insertAdjacentHTML("afterend", actBtn("stop-delete", "Stop", "", { task }));
}
function warnLine(html, icon) { return `<p class="dlg-warn">${icon || ICONS.warn}<span>${html}</span></p>`; }
function listLine(title, list, count, icon) {
  // other things the report lists inside what's being deleted, with their size and label
  const more = count > list.length ? `<li>and ${fmtInt(count - list.length)} more</li>` : "";
  return `<div class="dlg-warn">${icon}<div><span>${title}</span><ul class="dlg-list">${list.map(e =>
    `<li><b>${esc(e.name)}</b> · ${e.size != null ? esc(size(e.size)) + " · " : ""}${esc((SAFETY[e.safety] || SAFETY.unknown).label)}</li>`).join("")}${more}</ul></div></div>`;
}
function toast(html, kind, opts = {}) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.setAttribute("role", kind === "bad" ? "alert" : "status");
  el.innerHTML = `<div class="grow">${html}${opts.actions ? `<div class="acts">${opts.actions}</div>` : ""}</div>` +
    `<button class="ib" type="button" aria-label="Dismiss" data-dismiss>✕</button>`;
  el.querySelector("[data-dismiss]").addEventListener("click", () => el.remove());
  el.addEventListener("click", e => { if (e.target.closest("[data-act]")) setTimeout(() => el.remove(), 0); });
  document.getElementById("toasts").appendChild(el);
  if (!opts.sticky) setTimeout(() => el.remove(), opts.ms || (opts.actions ? 12000 : 7000));

}
async function pollTask(id, onProgress, every = 300) {
  for (;;) {
    const t = await api().task(id);
    if (t.done) return t.result || { ok: false, error: "The task ended without a result." };
    if (onProgress && t.progress) onProgress(t.progress);
    await sleep(every);
  }
}

// -- the actions
async function act(el) {
  const d = el.dataset;
  switch (d.act) {
    case "scan": return startScan();
    case "cancel-scan": return api().cancel_scan();
    case "explore": return explore(d.path);
    case "settings": return openSettings(d.key);
    case "delete": return askDelete(el);
    case "do-delete": return doDelete(d.mode);
    case "stop-delete": el.disabled = true; el.textContent = "Stopping…"; return api().stop_task(d.task);
    case "admin-delete": return doDeleteAsAdmin();
    case "empty-bin": return askEmptyBin();
    case "do-empty-bin": return doEmptyBin();
    case "uninstall": return askUninstall(d.group, +d.index);
    case "do-uninstall": return doUninstall();
    case "stop-task": return api().stop_task(d.task);
    case "run": return askRun(d.cmd);
    case "do-run": return doRun();
    case "close": return closeDialog();
  }
}
async function explore(path) {
  const r = await api().reveal(path);
  if (r && r.missing) toast(`It's no longer there${r.opened ? ", so the closest folder opened instead" : ""}.`);
}
async function openSettings(key) {
  const r = await api().open_settings(key);
  if (r && r.error) toast(esc(r.error), "bad");
}
document.addEventListener("change", async e => {
  if (e.target.id !== "drive") return;
  state.open.clear(); state.more.clear(); state.query = ""; state.tab = "overview";
  document.getElementById("search").value = "";
  applyState(await api().state(e.target.value));
});

async function askDelete(el) {
  const d = el.dataset;
  const it = d.id != null ? BY_ID.get(+d.id) : null;
  const whole = d.path == null;
  const paths = whole ? targetsOf(it) : [d.path];
  const contents = whole ? it.cat === "cache" : d.contents === "1";
  const ctx = {
    it, paths, contents, dup: d.dup === "1", file: d.file === "1",
    label: whole ? it.name : baseName(d.path),
    // everything under it at the last scan, other listed things inside included (a row's size already is that)
    size: whole ? (it.raw || it.size) : +d.size || 0,
    safety: it ? it.safety : "review",
  };
  openDialog(`<div class="dlg-body"><h3 id="dlg-title">Delete “${esc(ctx.label)}”?</h3><div class="dlg-busy"><span class="spin" aria-hidden="true"></span><span>Checking…</span></div></div>`);
  const check = await api().check(APP.drive, paths, contents);
  if (!check.ok) {
    openDialog(`<div class="dlg-body"><h3 id="dlg-title">Disk Report won't delete this</h3>
      <p>${esc(check.reason)}</p><div class="dlg-facts"><div class="path">${esc(check.path || paths[0])}</div></div></div>
      <div class="dlg-foot">${actBtn("explore", `${ICONS.folder}Open in Explorer`, "", { path: check.path || paths[0] })}
      <button class="btn primary" type="button" data-act="close" autofocus>OK</button></div>`);
    return;
  }
  ctx.check = check;
  PENDING = ctx;
  const trashFirst = ctx.dup || !["safe", "optional"].includes(ctx.safety);
  const goes = Math.max(0, ctx.size - (check.staysSize || 0));   // what stays inside isn't part of it
  const what = contents
    ? (paths.length > 1
      ? `Everything inside these ${paths.length} folders is deleted. The folders themselves stay, and the app fills them again when it needs to.`
      : "Everything inside this folder is deleted. The folder itself stays, and the app fills it again when it needs to.")
    : paths.length > 1 ? `These ${paths.length} folders and everything in them are deleted.`
    : ctx.file ? "This file is deleted." : "This folder and everything in it are deleted.";
  const warns = [];
  if (ctx.safety === "optional" && it && it.action) warns.push(warnLine(`<b>The trade-off:</b> ${rich(it.action)}`));
  if (ctx.safety === "unknown") warns.push(warnLine("Disk Report doesn't know what this is. Make sure nothing you use needs it."));
  if (ctx.dup) warns.push(warnLine("Keep at least one copy. Check that this isn't the copy you use, or a backup you made on purpose.", ICONS.info));
  if (check.also && check.also.length) warns.push(listLine("It also holds these, which the report lists on their own. They go with it:", check.also, check.alsoCount, ICONS.info));
  if (check.leave && check.leave.length) warns.push(listLine("Left alone, because the report lists them on their own with a more careful label. Delete them from their own rows if you want to:", check.leave, check.leaveCount, ICONS.lock));
  if (check.keep && check.keep.length) warns.push(listLine("Left alone, because Windows or an installed app needs them:", check.keep, check.keepCount, ICONS.lock));
  if (check.sync && check.sync.length) warns.push(warnLine(`It's synced with ${esc(check.sync.join(", "))}: deleting it here deletes it there too. To keep it online only, right-click it in File Explorer and choose “Free up space” instead.`));
  if (check.missing && check.missing.length === paths.length) warns.push(warnLine("It's already gone from the drive.", ICONS.info));
  openDialog(`<div class="dlg-body">
      <h3 id="dlg-title">Delete “${esc(ctx.label)}”?</h3>
      <div class="dlg-facts">${paths.slice(0, 8).map(p => `<div class="path">${esc(p)}</div>`).join("")}${paths.length > 8 ? `<div class="meta">and ${fmtInt(paths.length - 8)} more</div>` : ""}</div>
      <div class="dlg-line"><b>${esc(size(goes))}</b><span>at the last scan</span>${badge(ctx.safety)}</div>
      <p>${esc(what)}</p>
      ${warns.join("")}
      <p class="dlg-hint">Recycle Bin: you can restore it, and the space is freed when you empty the Recycle Bin. Delete permanently: the space is freed now.</p>
    </div>
    <div class="dlg-foot">
      <button class="btn" type="button" data-act="close" autofocus>Cancel</button>
      <button class="btn${trashFirst ? " primary" : ""}" type="button" data-act="do-delete" data-mode="trash">Move to Recycle Bin</button>
      <button class="btn danger${trashFirst ? "" : " solid"}" type="button" data-act="do-delete" data-mode="forever">${ICONS.trash}Delete permanently</button>
    </div>`);
}
async function doDelete(mode) {
  const ctx = PENDING;
  if (!ctx) return;
  dialogBusy(mode === "trash" ? "Moving to the Recycle Bin…" : "Deleting…");
  const r = await api().delete(APP.drive, ctx.paths, mode, ctx.contents);
  if (!r.ok) { closeDialog(); toast(esc(r.error), "bad"); return; }
  if (mode === "forever") dialogStop(r.task);
  const res = await pollTask(r.task, p => dialogBusy(`Deleting… ${plural(p.files, "file", "files")} · ${size(p.freed)} freed`));
  closeDialog();
  afterDelete(ctx, res);
}
async function doDeleteAsAdmin() {
  const ctx = LAST_DELETE;
  if (!ctx) return;
  const r = await api().delete_as_admin(APP.drive, ctx.paths, ctx.contents);
  if (!r.ok) { toast(esc(r.error), "bad"); return; }
  const wait = toast("Windows asks for administrator rights, then the rest is deleted…", "wait", { sticky: true });
  const res = await pollTask(r.task, null, 500);
  wait.remove();
  if (res.cancelled) { toast("Cancelled: Windows didn't get administrator rights."); return; }
  afterDelete(ctx, res);
}
function afterDelete(ctx, res) {
  if (res.ok === false && res.error) { toast(esc(res.error), "bad"); return; }
  applyRecord(res);
  if (res.usage) APP.usage = res.usage;
  render(); renderFreed();
  const name = `<b>${esc(ctx.label)}</b>`;
  const states = (res.paths || []).map(p => p.state);
  const all = s => states.length && states.every(x => x === s);
  const none = states.every(s => s === "failed");
  let msg, kind = "good", actions = "";
  if (res.mode === "trash") {
    const emptyBin = actBtn("empty-bin", "Empty Recycle Bin…", "");
    if (res.cancelled) {
      msg = none ? "Cancelled: nothing was moved to the Recycle Bin." : "Cancelled. What was already moved stays in the Recycle Bin.";
      kind = "";
    } else if (all("trashed")) {
      msg = `Moved ${name} to the Recycle Bin. The space is freed when you empty the Recycle Bin.`;
      actions = emptyBin;
    } else if (none) {
      msg = `${name} wasn't moved to the Recycle Bin.`; kind = "bad";
    } else {
      msg = `Moved part of ${name} to the Recycle Bin. The space is freed when you empty the Recycle Bin.`; kind = "";
      actions = emptyBin;
    }
    if (res.errors && res.errors.length) msg += " " + esc(res.errors[0]);
  } else if (res.stopped) {
    kind = "";
    msg = res.files ? `Stopped. ${plural(res.files, "file", "files")} of ${name} ${res.files === 1 ? "was" : "were"} deleted · freed ${esc(size(res.freed))}. The rest is still there.` : "Stopped before anything was deleted.";
  } else if (all("deleted") || all("emptied")) {
    msg = `Deleted ${name} · freed ${esc(size(res.freed))}.`;
  } else {
    kind = none ? "bad" : "";
    msg = res.freed ? `Deleted part of ${name} · freed ${esc(size(res.freed))}.` : `${name} wasn't deleted.`;
    if (res.inUse) msg += ` ${plural(res.inUse, "file is", "files are")} in use: close the app that uses ${res.inUse === 1 ? "it" : "them"}, then try again.`;
    if (res.denied) {
      msg += ` ${plural(res.denied, "item needs", "items need")} administrator rights.`;
      if (!res.admin) { LAST_DELETE = ctx; actions = actBtn("admin-delete", "Delete the rest as administrator", ""); }
    }
    if (res.errors && res.errors.length) msg += " " + esc(res.errors[0]);
  }
  if (res.kept) msg += ` Left alone: ${plural(res.kept, "part", "parts")} that Windows or an installed app needs.`;
  if (res.left) {
    const names = ((ctx.check && ctx.check.leave) || []).map(e => esc(e.name));
    msg += ` Left alone, as the report lists ${res.left === 1 ? "it" : "them"} on ${res.left === 1 ? "its" : "their"} own: ${names.length ? names.join(", ") : plural(res.left, "part", "parts")}.`;
  }
  toast(msg, kind, { actions });
}

async function askEmptyBin() {
  const info = await api().bin_info(APP.drive);
  if (!info || !info.items) { toast(`The Recycle Bin on ${esc(APP.drive)} is already empty.`, "good"); return; }
  PENDING = { bin: true };
  openDialog(`<div class="dlg-body"><h3 id="dlg-title">Empty the Recycle Bin?</h3>
      <p>The Recycle Bin on ${esc(APP.drive)} holds <b>${esc(size(info.size))}</b> in ${plural(info.items, "item", "items")}. Emptying it deletes them for good.</p></div>
    <div class="dlg-foot"><button class="btn" type="button" data-act="close" autofocus>Cancel</button>
      ${actBtn("do-empty-bin", `${ICONS.trash}Empty Recycle Bin`, "danger solid")}</div>`);
}
async function doEmptyBin() {
  dialogBusy("Emptying the Recycle Bin…");
  const r = await api().empty_bin(APP.drive);
  const res = await pollTask(r.task);
  closeDialog();
  if (!res.ok) { toast(esc(res.error || "The Recycle Bin wasn't emptied."), "bad"); return; }
  applyRecord(Object.assign({ kind: "empty-bin" }, res));
  if (res.usage) APP.usage = res.usage;
  render(); renderFreed();
  toast(`Emptied the Recycle Bin · freed ${esc(size(res.freed))}.`, "good");
}

function askUninstall(group, index) {
  const u = ((DATA.apps || {})[group] || [])[index];
  if (!u) return;
  PENDING = { group, index, u };
  const how = u.kind === "store"
    ? `Disk Report removes the Microsoft Store app ${esc(u.name)} for your account, as Settings → Apps does.`
    : `Disk Report starts ${esc(u.name)}'s own uninstaller, as Settings → Apps does. Follow its steps: Disk Report notices when the app is gone.`;
  openDialog(`<div class="dlg-body"><h3 id="dlg-title">Uninstall ${esc(u.name)}?</h3>
      <p>${how}</p>
      ${warnLine("Its settings, data and caches may stay behind. Once it's uninstalled, you can delete them from this report.", ICONS.info)}</div>
    <div class="dlg-foot"><button class="btn" type="button" data-act="close" autofocus>Cancel</button>
      ${actBtn("do-uninstall", `${ICONS.unbox}Uninstall`, "danger solid")}</div>`);
}
async function doUninstall() {
  const p = PENDING;
  if (!p) return;
  closeDialog();
  const r = await api().uninstall(APP.drive, p.group, p.index);
  if (!r.ok) { toast(esc(r.error), "bad"); return; }
  WAITING.set(p.group, p.u.name); render();
  const waiting = `Waiting for ${esc(p.u.name)} to be uninstalled. Follow the uninstaller's steps.`;
  const wait = toast(`<span class="msg">${waiting}</span>`, "wait",
    { sticky: true, actions: actBtn("stop-task", "Stop waiting", "", { task: r.task }) });
  const res = await pollTask(r.task, pr => {
    const line = wait.querySelector(".msg");
    if (line) line.innerHTML = pr.running ? waiting : `${esc(p.u.name)}'s uninstaller has closed. Checking that Windows no longer lists it…`;
  }, 1000);
  wait.remove();
  WAITING.delete(p.group);
  if (res.state === "removed") {
    markRemoved({ group: p.group, index: p.index, name: p.u.name });
    const others = stillInstalled(p.group);
    toast(`Uninstalled <b>${esc(p.u.name)}</b>. ` + (others.length
      ? `Still installed in ${esc(p.group)}: ${others.map(esc).join(", ")}, so its folders stay until ${others.length === 1 ? "it's" : "they're"} uninstalled too.`
      : "Its leftover folders can now be deleted here. Scan again to see what it freed."), "good", { actions: actBtn("scan", `${ICONS.scan}Scan again`, "") });
  } else if (res.state === "cancelled") toast("Uninstall cancelled.");
  else if (res.state === "kept") toast(`Windows still lists ${esc(p.u.name)} as installed, and its uninstaller has closed. If the uninstall is still going on in another window, or asked you to restart, scan again once it's done.`);
  else if (res.state === "stopped") toast(`Stopped waiting. If you finished uninstalling ${esc(p.u.name)}, scan again to update the report.`);
  else toast(esc(res.error || "The uninstall didn't work."), "bad");
  if (res.usage) APP.usage = res.usage;
  render(); renderFreed();
}

function askRun(cmd) {
  PENDING = { cmd };
  const admin = APP.commands[cmd];
  openDialog(`<div class="dlg-body"><h3 id="dlg-title">Run this command?</h3>
      <div class="dlg-facts"><code>${esc(cmd)}</code></div>
      <p>It opens a terminal window and runs there, so you can follow it and answer if it asks something. Close the window when it's done.</p>
      ${admin ? warnLine("Windows will ask for administrator rights.", ICONS.lock) : ""}</div>
    <div class="dlg-foot"><button class="btn" type="button" data-act="close" autofocus>Cancel</button>
      ${actBtn("do-run", `${ICONS.run}Run`, "primary")}</div>`);
}
async function doRun() {
  const p = PENDING;
  if (!p) return;
  closeDialog();
  const r = await api().run_command(p.cmd);
  if (r.ok) toast("Started in a terminal window. Scan again afterwards to see the space it freed.", "good");
  else if (!r.cancelled) toast(esc(r.error), "bad");
}

// The app calls this when its window is closed while something is still being deleted or uninstalled
function closingSoon() {
  toast("Disk Report closes as soon as what it's doing is finished and written in its log. Close it again to quit now.", "wait", { sticky: true });
}

// ------------------------------------------------------------------ start
if (EMBEDDED) {
  load(EMBEDDED);
  renderHeader();
  render();
  renderFoot();
} else {
  document.getElementById("title").textContent = "Disk Report";
  document.getElementById("bar-row").hidden = true;
  whenApp(startApp);
}
</script>
</body>
</html>
